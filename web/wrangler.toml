name = "garmin-health"
main = "src/server.ts"
compatibility_date = "2026-09-12"

routes = [
  { pattern = "garmin.brianvia.com", custom_domain = true }
]

[triggers]
crons = ["15,45 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "garmin-data"
database_id = "cf87fd80-5c1f-4d55-b7eb-101708651628"
# Rollback: the pre-migration copy fed by via-server is garmin-health / 91ee2ecd-b717-4b14-a817-a39d5c89f9f7.

[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sync", "/sync/*", "/mcp", "/mcp/*", "/brief"]

# Garmin is read over REST through home/proxy.py on via-server, so requests leave from the home IP. See USAGE.md.
[vars]
GARMIN_PROXY_URL = "http://garmin-home"

# The private route to it: a Workers VPC service on via-server's Cloudflare Tunnel, with no public hostname.
# Replace the id with the one `wrangler vpc service create` prints.
[[vpc_services]]
binding = "GARMIN_HOME"
service_id = "REPLACE_WITH_VPC_SERVICE_ID"

# GarminCollector (the retired container host) is still exported but has no binding; see src/server.ts.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GarminCollector"]

# Secrets: MCP_BEARER, SYNC_TOKEN, SLACKPIPES_WEBHOOK, GARMIN_PROXY_TOKEN, SESSION_KEY
